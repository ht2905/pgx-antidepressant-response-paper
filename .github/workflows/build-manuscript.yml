name: Build and Release Manuscript

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Render Manuscript & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install System & Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ghostscript \
            perl \
            fontconfig \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libtiff-dev \
            libjpeg-dev \
            libxml2-dev \
            libcurl4-openssl-dev \
            libssl-dev

      - name: Set up Quarto and TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Verify and Pre-install TeX Packages
        run: |
          tlmgr update --self || true
          tlmgr install \
            elsarticle \
            natbib \
            threeparttable \
            placeins \
            breakurl \
            float \
            array \
            hyperref \
            url \
            xcolor \
            amsmath \
            amsfonts \
            tools || true

      - name: Render Quarto Manuscript to PDF
        run: |
          quarto render pgx-antidepressant-response_article.qmd

      - name: Verify Output PDF Exists
        run: |
          test -s pgx-antidepressant-response_article.pdf || (echo "PDF generation failed!" && exit 1)
          ls -lh pgx-antidepressant-response_article.pdf

      - name: Upload Manuscript Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgx-antidepressant-response-manuscript
          path: pgx-antidepressant-response_article.pdf
          retention-days: 30

      - name: Upload Coursework Cover Page Artifact
        uses: actions/upload-artifact@v4
        with:
          name: assignment-cover-page
          path: assignment_cover-page.pdf
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || 'Latest Manuscript Publication' }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'legacy' }}
          body: |
            ## CYP2D6 and CYP2C19 Pharmacogenomics Review Manuscript
            
            Publication-ready compiled deliverables for *CYP2D6 and CYP2C19 Polymorphisms as Predictors of Antidepressant Response*.
            
            ### Included Deliverables
            - **`pgx-antidepressant-response_article.pdf`**: The full scientific review paper formatted in the Elsevier 5p layout.
            - **`assignment_cover-page.pdf`**: Coursework cover sheet for BT313IU (Genetics, International University – VNU-HCM).
            
            *Compiled automatically via GitHub Actions with Quarto, TinyTeX, and bundled Linux system dependencies.*
          files: |
            pgx-antidepressant-response_article.pdf
            assignment_cover-page.pdf
